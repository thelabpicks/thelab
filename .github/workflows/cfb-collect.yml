# Collects college football data every day: scores, schedules, closing lines and box scores (cfbfastR / ESPN via
# sportsdataverse), the ESPN scoreboard with ESPN's posted lines, and sportsbook prices within the Odds API budget
# (Tuesday and Saturday; see backend/cfb/collect.py). Snapshots that nobody else archives are committed to the cfb-data
# branch so every day is kept. It then builds the college models and numbers (backend/cfb/pipeline.py), freezes each
# game's picks on game day for the live record, and the "Refresh data and publish site" workflow publishes them when
# this run finishes.
name: Collect college football data

on:
  schedule:
    - cron: "0 15 * * *"   # every day 15:00 UTC (11:00 ET in summer time, 10:00 ET in winter), before Saturday's noon kickoffs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfb-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      # Optional repository variable that pins the season; unset, it rolls over on September 1 (cfb/sources.py).
      CFB_SEASON: ${{ vars.CFB_SEASON }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check out the cfb-data branch (created on the first run)
        run: |
          if git ls-remote --exit-code --heads origin cfb-data >/dev/null; then
            git fetch --depth 1 origin cfb-data
            git worktree add cfb-archive origin/cfb-data
          else
            git worktree add --detach cfb-archive
            git -C cfb-archive checkout --orphan cfb-data
            git -C cfb-archive rm -rfq .
            printf '# College football daily snapshots\n\nWritten by the "Collect college football data" workflow: scoreboard/, rankings/, odds/ (one file per day), picks/ (each game frozen on game day), status.json and runs.jsonl.\n' > cfb-archive/README.md
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Finished seasons never change; the current season and the betting file are refreshed by the collector.
      - name: Restore downloaded college football files
        uses: actions/cache@v4
        with:
          path: data/cfb/raw
          key: cfb-raw-${{ github.run_id }}
          restore-keys: cfb-raw-

      - name: Install backend
        run: pip install -r backend/requirements.txt

      - name: Collect
        working-directory: backend
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFB_ARCHIVE_DIR: ${{ github.workspace }}/cfb-archive
        run: python -m cfb.collect

      - name: Build college football models and numbers
        working-directory: backend
        env:
          CFB_ARCHIVE_DIR: ${{ github.workspace }}/cfb-archive
        run: python -m cfb.pipeline

      - name: Save college football pages for the website
        uses: actions/cache/save@v4
        with:
          path: site-data/cfb
          key: cfb-site-${{ github.run_id }}

      # A second copy outside the build cache: GitHub drops cache entries unused for 7 days or past 10 GB, and the site
      # publish falls back to this copy so the college football tab never goes up empty.
      - name: Keep a copy of the college football pages
        uses: actions/upload-artifact@v4
        with:
          name: cfb-site
          path: site-data/cfb
          retention-days: 30

      - name: Save today's snapshots to the cfb-data branch
        if: always()
        working-directory: cfb-archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "College football snapshots $(date -u +%F)"
          for i in 1 2 3 4; do git push origin HEAD:cfb-data && exit 0; sleep $((2**i)); git pull --rebase -q origin cfb-data || true; done
          exit 1
