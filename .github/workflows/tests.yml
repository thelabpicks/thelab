# Runs the site's checks on every pull request, before a change can reach the live site: the website's type check and
# tests, and the engine's tests. The publish workflow runs the engine tests again on each refresh.
name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type check and tests
        working-directory: frontend
        run: |
          npm ci
          npx tsc -b --noEmit
          npx vitest run

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Engine tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m pytest -q
