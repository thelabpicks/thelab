# Collects NBA data every day: box scores and schedule (sportsdataverse / ESPN), the injury report and scoreboard
# (ESPN), and sportsbook prices within the Odds API budget (see backend/nba/collect.py). Snapshots that nobody else
# archives are committed to the nba-data branch so every day is kept. It then builds the NBA models and numbers
# (backend/nba/pipeline.py), freezes the day's leans for the live record, and the "Refresh data and publish site"
# workflow publishes them when this run finishes.
name: Collect NBA data

on:
  schedule:
    - cron: "0 9 * * *"    # early refresh, 09:00 UTC (4-5 am Central): last night graded, new projections and injuries.
                           # Prop lines are not bought yet (too few are posted this early); the 16:00 run buys them.
    - cron: "0 16 * * *"   # every day 16:00 UTC (noon ET in summer time, 11:00 ET in winter), before tip-off
    - cron: "30 22 * * *"  # pre-tip refresh (6:30 pm ET in summer time, 5:30 pm in winter): latest injury report, rosters and
                           # box scores; re-saves the leans of games not yet started. Odds are kept from the morning (no credits).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Check out the nba-data branch (created on the first run)
        run: |
          if git ls-remote --exit-code --heads origin nba-data >/dev/null; then
            git fetch --depth 1 origin nba-data
            git worktree add nba-archive origin/nba-data
          else
            git worktree add --detach nba-archive
            git -C nba-archive checkout --orphan nba-data
            git -C nba-archive rm -rfq .
            printf '# NBA daily snapshots\n\nWritten by the "Collect NBA data" workflow: odds/, injuries/, scoreboard/ (one file per day), status.json and runs.jsonl.\n' > nba-archive/README.md
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Finished seasons never change; the current season is refreshed by the collector when older than 6 hours.
      - name: Restore downloaded NBA box scores
        uses: actions/cache@v4
        with:
          path: data/nba/raw
          key: nba-raw-${{ github.run_id }}
          restore-keys: nba-raw-

      # Finished walk-forward months never change, so only the current month is refit each day.
      - name: Restore NBA walk-forward results
        uses: actions/cache@v4
        with:
          path: data/nba/results
          key: nba-results-${{ github.run_id }}
          restore-keys: nba-results-

      - name: Install backend
        run: pip install -r backend/requirements.txt

      - name: Collect
        working-directory: backend
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NBA_ARCHIVE_DIR: ${{ github.workspace }}/nba-archive
        run: python -m nba.collect

      # On the free odds plan the pipeline buys real prop lines for the likeliest picks' games (NBA_PROP_CREDITS a day).
      - name: Build NBA models and numbers
        working-directory: backend
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NBA_ARCHIVE_DIR: ${{ github.workspace }}/nba-archive
        run: python -m nba.pipeline

      - name: Save NBA pages for the website
        uses: actions/cache/save@v4
        with:
          path: site-data/nba
          key: nba-site-${{ github.run_id }}

      - name: Save today's snapshots to the nba-data branch
        if: always()
        working-directory: nba-archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "NBA snapshots $(date -u +%F)"
          for i in 1 2 3 4; do git push origin HEAD:nba-data && exit 0; sleep $((2**i)); git pull --rebase -q origin nba-data || true; done
          exit 1
