# Rebuilds the free hosted website from fresh nflverse data and publishes it to GitHub Pages.
# Runs Tuesday morning (after Monday night), Thursday morning (injury reports, before TNF),
# Saturday morning, Sunday morning (final injury designations), Sunday evening (before the night game) and Monday
# afternoon (Sunday's games graded, before Monday night), on every push to main,
# and on demand from the Actions tab. Sportsbook prices are fetched on Saturday and manual runs, and on Thursday for
# the Thursday night game only.
# After the daily NBA and college football runs ("Collect NBA data", "Collect college football data") it republishes
# with their fresh numbers and reuses the NFL pages from the last full run, so the NFL pipeline is not repeated daily.
name: Refresh data and publish site

on:
  schedule:
    - cron: "0 12 * * 2"   # Tue 12:00 UTC
    - cron: "0 15 * * 4"   # Thu 15:00 UTC
    - cron: "0 15 * * 6"   # Sat 15:00 UTC
    - cron: "0 14 * * 0"   # Sun 14:00 UTC
    - cron: "30 21 * * 0"  # Sun 21:30 UTC, before Sunday night
    - cron: "0 20 * * 1"   # Mon 20:00 UTC, Sunday graded, before Monday night
    # Quick republishes (no NFL model run) that post each game's simulation on game day: 10 am Eastern (14:00 UTC in
    # summer time, 15:00 in winter) and 12:00 UTC for games that start before about 11 am Eastern (international NFL).
    - cron: "0 12 * * *"
    - cron: "0 14 * * 1-6"
    - cron: "0 15 * * 0,1,2,3,5"
  workflow_dispatch:
    inputs:
      odds_within_hours:
        description: "Buy prices only for games kicking off within this many hours (empty: the whole week)"
        required: false
        default: ""
  push:
    branches: [main]
  workflow_run:
    workflows: ["Collect NBA data", "Collect college football data"]
    types: [completed]

permissions:
  contents: write   # saves the weekly pick log to the nfl-data branch

  pages: write
  id-token: write
  actions: read     # reads the saved NBA and college pages when the build cache has dropped them

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional repository variables that pin a season; unset, each rolls over by date (engine/nba/cfb sources.py).
      NFL_SEASON: ${{ vars.NFL_SEASON }}
      NBA_SEASON: ${{ vars.NBA_SEASON }}
      CFB_SEASON: ${{ vars.CFB_SEASON }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # NBA_ONLY: reuse the NFL pages from the last full run instead of re-running the NFL model (~30 minutes). Used
      # after the daily NBA and college runs, and for pushes that change only the website (frontend/), which need no
      # new NFL numbers. Pushes that touch the backend, the workflows or anything else do the full run.
      - name: Decide whether the NFL model needs to run
        run: |
          quick=false
          if [ "${{ github.event_name }}" = workflow_run ]; then quick=true
          elif [ "${{ github.event_name }}" = schedule ] && case "${{ github.event.schedule }}" in "0 12 * * *"|"0 14 * * 1-6"|"0 15 * * 0,1,2,3,5") true;; *) false;; esac; then
            quick=true; echo "Game-day simulation posting: reusing the NFL pages from the last full run"
          elif [ "${{ github.event_name }}" = push ] && changed=$(git diff --name-only HEAD^1 HEAD) && [ -n "$changed" ] \
               && ! echo "$changed" | grep -qv '^frontend/'; then
            quick=true; echo "Website-only change: reusing the NFL pages from the last full run"
          fi
          echo "NBA_ONLY=$quick" >> "$GITHUB_ENV"

      # NBA-only runs reuse the NFL pages saved by the last full run; without them the full NFL run happens.
      - name: Restore NFL pages from the last full run
        id: nflsite
        if: env.NBA_ONLY == 'true'
        uses: actions/cache/restore@v4
        with:
          path: site-data
          key: nfl-site-${{ github.run_id }}
          restore-keys: nfl-site-

      # Every pick the site suggests is saved before kickoff and graded after the game (engine/picklog.py), and so is
      # The Lab's top 10 (frontend/scripts/lab-picks.ts, on every run). Each game's simulation is frozen at kickoff too
      # (sims/, engine/simreview.py) and re-run after the final with what really happened. The saved picks and sims must
      # survive between runs, so they live on the nfl-data branch.
      - name: Check out the nfl-data branch (created on the first run)
        run: |
          if git ls-remote --exit-code --heads origin nfl-data >/dev/null; then
            git fetch --depth 1 origin nfl-data
            git worktree add pick-archive origin/nfl-data
          else
            git worktree add --detach pick-archive
            git -C pick-archive checkout --orphan nfl-data
            git -C pick-archive rm -rfq .
            printf '# NFL pick log\n\nWritten by the "Refresh data and publish site" workflow: picks/ holds every pick the site showed each week, frozen at kickoff.\n' > pick-archive/README.md
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Older seasons never change; keeping them between runs avoids re-downloading them.
      # Current-season files and the schedule are refreshed by the importer when older than 6 hours.
      - name: Restore downloaded nflverse files
        if: env.NBA_ONLY != 'true' || steps.nflsite.outputs.cache-matched-key == ''
        uses: actions/cache@v4
        with:
          path: data/raw
          key: nflverse-raw-${{ github.run_id }}
          restore-keys: nflverse-raw-

      # Sportsbook price snapshots (The Odds API) are kept between runs so the weekly fetch is reused.
      - name: Restore sportsbook price snapshots
        id: odds
        if: env.NBA_ONLY != 'true' || steps.nflsite.outputs.cache-matched-key == ''
        uses: actions/cache@v4
        with:
          path: data/odds
          key: odds-${{ github.run_id }}
          restore-keys: odds-

      # The snapshots are also kept on the nfl-data branch (odds/), so the week's paid prices survive the cache dropping them.
      - name: Fall back to the price snapshots on the nfl-data branch
        if: (env.NBA_ONLY != 'true' || steps.nflsite.outputs.cache-matched-key == '') && steps.odds.outputs.cache-matched-key == ''
        run: |
          if [ -d pick-archive/odds ]; then mkdir -p data/odds && cp -r pick-archive/odds/. data/odds/ && echo "::warning::Price snapshots restored from the nfl-data branch"; fi

      - name: Install backend
        if: env.NBA_ONLY != 'true' || steps.nflsite.outputs.cache-matched-key == ''
        run: pip install -r backend/requirements.txt

      - name: Download, import, validate and predict
        if: env.NBA_ONLY != 'true' || steps.nflsite.outputs.cache-matched-key == ''
        working-directory: backend
        env:
          # Optional repository secret. Without it the site still builds and prices are typed in by hand.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Fetch prices on the Saturday run and on manual runs (free plan: 500 credits a month). Thursday's run buys only
          # the games kicking off within 36 hours (the Thursday night game, about 6 credits) so it gets real lines too.
          FG_ODDS_FETCH: ${{ github.event.schedule == '0 15 * * 6' || github.event.schedule == '0 15 * * 4' || github.event_name == 'workflow_dispatch' }}
          FG_ODDS_WITHIN_HOURS: ${{ github.event.schedule == '0 15 * * 4' && '36' || inputs.odds_within_hours }}
          FG_PICKS_DIR: ${{ github.workspace }}/pick-archive/picks
        run: python -m engine.cli all --download

      - name: Save the pick log to the nfl-data branch
        if: env.NBA_ONLY != 'true' || steps.nflsite.outputs.cache-matched-key == ''
        working-directory: pick-archive
        run: |
          if [ -d ../data/odds ]; then mkdir -p odds && cp -r ../data/odds/. odds/; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "Pick log $(date -u +%F)"
          for i in 1 2 3 4; do git push origin HEAD:nfl-data && exit 0; sleep $((2**i)); git pull --rebase -q origin nfl-data || true; done
          exit 1

      - name: Check engine invariants
        if: env.NBA_ONLY != 'true' || steps.nflsite.outputs.cache-matched-key == ''
        working-directory: backend
        run: python -m pytest -q

      - name: Export every page's data
        if: env.NBA_ONLY != 'true' || steps.nflsite.outputs.cache-matched-key == ''
        working-directory: backend
        run: python -m engine.export_static

      - name: Save NFL pages for NBA-only runs
        if: env.NBA_ONLY != 'true' || steps.nflsite.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: site-data
          key: nfl-site-${{ github.run_id }}

      # NBA numbers are computed by the "Collect NBA data" workflow and kept in the cache.
      - name: Restore NBA pages
        id: nbasite
        uses: actions/cache/restore@v4
        with:
          path: site-data/nba
          key: nba-site-${{ github.run_id }}
          restore-keys: nba-site-

      - name: Fall back to the last saved NBA pages
        if: steps.nbasite.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow nba-collect.yml --status success -L 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$id" ] && gh run download "$id" -R "$GITHUB_REPOSITORY" -n nba-site -D site-data/nba; then
            echo "::warning::NBA pages came from the saved copy of run $id (build cache was empty)"
          else
            echo "::error::No NBA pages in the build cache or a saved copy: the NBA tab publishes without data"
          fi

      # College football numbers are computed by the "Collect college football data" workflow and kept in the cache.
      - name: Restore college football pages
        id: cfbsite
        uses: actions/cache/restore@v4
        with:
          path: site-data/cfb
          key: cfb-site-${{ github.run_id }}
          restore-keys: cfb-site-

      - name: Fall back to the last saved college football pages
        if: steps.cfbsite.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow cfb-collect.yml --status success -L 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$id" ] && gh run download "$id" -R "$GITHUB_REPOSITORY" -n cfb-site -D site-data/cfb; then
            echo "::warning::college football pages came from the saved copy of run $id (build cache was empty)"
          else
            echo "::error::No college football pages in the build cache or a saved copy: the college football tab publishes without data"
          fi

      # The Lab's top 10 across NFL, college football and NBA: ranked from every sport's fresh numbers, frozen at each
      # game's start and graded after the final. A failure here leaves the page on its last board; the site still publishes.
      - name: Build The Lab's top 10
        working-directory: frontend
        env:
          LAB_DATA: ${{ github.workspace }}/site-data
          LAB_ARCHIVE: ${{ github.workspace }}/pick-archive/lab
        run: |
          npm ci
          npx vite-node scripts/lab-picks.ts || echo "::warning::The Lab's top 10 was not rebuilt this run"

      # Game Simulations page inputs: the newest NFL week of pregame sims (nfl-data branch, sims/) and today's NBA slate.
      # A failure leaves the page without games for this run; the site still publishes.
      - name: Write the game simulation inputs
        working-directory: frontend
        env:
          LAB_DATA: ${{ github.workspace }}/site-data
          SIMS_DIR: ${{ github.workspace }}/pick-archive/sims
          SIM_ARCHIVE: ${{ github.workspace }}/pick-archive/gamesims
        run: npx vite-node scripts/game-sims.ts || echo "::warning::Game simulation inputs were not written this run"

      # Every NBA and NFL game sim is frozen at its start and graded against ESPN's final box score once the game is over
      # (winner, each team's points, the total, every player's stats). The grades feed the daily report and the Sims
      # page's track record; the archive is kept on the nfl-data branch. A failure leaves the last grades in place.
      - name: Grade the game simulations
        working-directory: frontend
        env:
          LAB_DATA: ${{ github.workspace }}/site-data
          SIM_ARCHIVE: ${{ github.workspace }}/pick-archive/gamesims
        run: npx vite-node scripts/sim-grades.ts || echo "::warning::Game simulations were not graded this run"

      # Each posted game's Sim Parlay: legs counted from the same 5,000 seeded runs the page plays, built once when the
      # game posts and never changed, then graded from the sim's grade above. Kept in gamesims/parlays.json on the
      # nfl-data branch. A failure leaves the page without new parlays for this run.
      - name: Build and grade the Sim Parlays
        working-directory: frontend
        env:
          LAB_DATA: ${{ github.workspace }}/site-data
          SIM_ARCHIVE: ${{ github.workspace }}/pick-archive/gamesims
        run: npx vite-node scripts/sim-parlays.ts || echo "::warning::Sim Parlays were not built this run"

      # The daily model report posted to the "Daily model report" issue each morning (lab-ops.yml; not on the site): how the picks and every lean did on
      # yesterday's games, where the predictions were off and why, and what the models changed in themselves. Every run
      # rewrites today's report, so the 4 am Central run (after the 09:00 UTC NBA collect) writes the first one.
      - name: Write the daily report
        working-directory: frontend
        env:
          LAB_DATA: ${{ github.workspace }}/site-data
          LAB_ARCHIVE: ${{ github.workspace }}/pick-archive/lab
        run: npx vite-node scripts/lab-report.ts || echo "::warning::The daily report was not written this run"

      - name: Save The Lab's top 10 to the nfl-data branch
        working-directory: pick-archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "Lab picks $(date -u +%F)"
          for i in 1 2 3 4; do git push origin HEAD:nfl-data && exit 0; sleep $((2**i)); git pull --rebase -q origin nfl-data || true; done
          exit 1

      - name: Build website
        working-directory: frontend
        env:
          VITE_STATIC: "1"
        run: |
          npm run build
          cp -r ../site-data dist/data
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
