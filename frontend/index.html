<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Lab: daily NFL, college football and NBA picks from 5,000-game simulations, every result graded in public." />
    <!-- Link preview on Twitter/X, iMessage, Discord and others -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Lab" />
    <meta property="og:title" content="The Lab: picks, sims and data" />
    <meta property="og:description" content="Daily NFL, college football and NBA picks from 5,000-game simulations, every result graded in public." />
    <meta property="og:url" content="https://thelabpicks.github.io/thelab/" />
    <meta property="og:image" content="https://thelabpicks.github.io/thelab/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Lab: picks, sims and data" />
    <meta name="twitter:description" content="Daily NFL, college football and NBA picks from 5,000-game simulations, every result graded in public." />
    <meta name="twitter:image" content="https://thelabpicks.github.io/thelab/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" />
    <title>The Lab</title>
    <script>
      try {
        const t = localStorage.getItem("fg-theme") || "dark";
        const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        if (/^#?\/nba(\/|$|\?)/.test(location.hash) || /^\/nba(\/|$)/.test(location.pathname)) document.documentElement.dataset.sport = "nba";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
