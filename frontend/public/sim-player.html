<style>
/* The Game Simulations player, shown inside the site's /sims pages (src/pages/Sims.tsx) in a frame so its styles stay
   apart from the site's. Data: data/sims/games.json (scripts/game-sims.ts). Layout: one column, scoreboard band over the playing surface, play ticker under it, then box score and method notes. Tokens mirror The Lab's site palette. */
:root {
  --bg: #0B1018; --surface: #141E29; --raised: #1B2735; --line: #263444;
  --fg: #F4F7FA; --muted: #93A2B4; --accent: #9BE15D; --accent-soft: rgba(155,225,93,.12);
  --danger: #F87171; --warn: #F0B84C; --info: #7DB0FF;
  --court: #121821; --court-line: #2E3B4B; --paint: #18212C;
  --field: #0F1C15; --field-line: #24392C; --field-num: #4C6B57;
  --font-display: 'Space Grotesk', Inter, ui-sans-serif, system-ui, sans-serif;
  --font-body: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; } html { background: var(--bg); } body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1120px; width: 100%; margin: 0 auto; padding: 0 0 8px; display: grid; gap: 16px; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { white-space: nowrap; font-family: var(--font-display); font-size: 20px; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: 13px; }
.tabs { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.tabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-weight: 600; font-size: 13px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--raised); color: var(--fg); }
.tabs small { font-weight: 500; opacity: .8; margin-left: 4px; }

/* The replay: a scoreboard of two team tiles around the clock, a flat top-down field or court, a running play feed,
   and a game-flow strip (the score margin through the game) that doubles as the scrubber. */
.stage { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); overflow: hidden; position: relative; }
.sb { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; gap: 8px; padding: 10px; }
.tile { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 10px; padding: 10px 14px; border-radius: 12px; background: linear-gradient(115deg, color-mix(in srgb, var(--tc) 30%, transparent), color-mix(in srgb, var(--tc) 6%, transparent) 70%); border: 1px solid color-mix(in srgb, var(--tc) 40%, var(--line)); min-width: 0; }
.tile.r { grid-template-columns: auto minmax(0, 1fr); text-align: right; background: linear-gradient(245deg, color-mix(in srgb, var(--tc) 30%, transparent), color-mix(in srgb, var(--tc) 6%, transparent) 70%); }
.tile.r .tn { order: 2; } .tile.r .ts { order: 1; text-align: left; }
.tile .ab { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.1; letter-spacing: .01em; }
.tile .full { display: block; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .ts { font-family: var(--font-display); font-weight: 700; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
.tile .ball { display: none; font-size: 10.5px; font-weight: 700; color: var(--bg); background: var(--accent); border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: 3px; }
.tile.has .ball { display: inline-block; }
.tile.r .ball { margin: 0 6px 0 0; }
.clock { display: grid; place-content: center; justify-items: center; gap: 2px; min-width: 96px; padding: 4px 10px; border-radius: 12px; background: var(--raised); }
.clock .per { font-size: 11px; font-weight: 600; color: var(--muted); }

.clock .simtag { font-size: 10px; font-weight: 700; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); border-radius: 999px; padding: 0 7px; }
.strip { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; padding: 8px 14px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--raised) 55%, transparent); }
.lines { overflow-x: auto; }
.lines table { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.lines th, .lines td { padding: 1px 7px; text-align: center; }
.lines th { color: var(--muted); font-weight: 500; }
.lines td:first-child, .lines th:first-child { text-align: left; font-weight: 600; }
.lines td:last-child { font-weight: 700; }
.situ { display: flex; flex-wrap: wrap; gap: 6px; }
.situ span { font-size: 12px; font-weight: 600; border-radius: 8px; padding: 3px 9px; background: var(--raised); color: var(--muted); }

.situ .ydg i b { position: absolute; inset: 0 auto 0 0; background: var(--accent); }

.surface { position: relative; background: var(--bg); padding: 10px; }
canvas { display: block; width: 100%; max-width: 100%; border-radius: 12px; }

.feed { list-style: none; margin: 0; padding: 6px 10px 10px; display: grid; gap: 6px; min-height: 150px; align-content: start; }
.feed li { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 8px 12px 8px 0; border-radius: 10px; background: var(--raised); }
.feed li .tb { grid-row: 1 / span 2; align-self: stretch; border-radius: 4px 0 0 4px; background: var(--tc); }
.feed li .hd { font-size: 13.5px; font-weight: 600; min-width: 0; }

.feed li.old .hd { font-size: 12.5px; font-weight: 500; } .feed li.old .tx { display: none; }
.feed .idle { display: block; color: var(--muted); font-size: 13px; padding: 10px 2px; background: none; }
.tg.good { color: var(--accent); } .tg.bad { color: var(--danger); } .tg.neutral { color: var(--muted); } .tg.big { color: var(--warn); }

.controls { display: grid; gap: 10px; padding: 12px 14px 14px; border-top: 1px solid var(--line); }
.crow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--raised); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 13px; }
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.btn.round { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; font-size: 15px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--fg); }
.spacer { flex: 1; }
.prog { display: grid; gap: 4px; }
.flowl { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.bar { position: relative; height: 46px; border-radius: 10px; background: var(--raised); cursor: pointer; overflow: hidden; }
.bar svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.bar .fill { position: absolute; inset: 0 auto 0 0; border-right: 2px solid var(--accent); pointer-events: none; }
.bar .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: color-mix(in srgb, var(--line) 80%, transparent); pointer-events: none; }
.marks { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); }

.intro { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(3px); z-index: 2; overflow-y: auto; }
.intro[hidden] { display: none !important; }
.ic { max-width: 560px; width: 100%; display: grid; gap: 14px; justify-items: center; text-align: center; }
.ic .eyebrow { font-size: 11px; font-weight: 700; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); border-radius: 999px; padding: 2px 10px; }
.match { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; width: 100%; align-items: stretch; }
.match .tile { grid-template-columns: 1fr; text-align: left; gap: 4px; padding: 14px; }

.odds span { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; background: var(--surface); }

.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }

.card h2 { font-family: var(--font-display); font-size: 15px; margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card h2 small { font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--muted); }
.tbl { overflow-x: auto; }
.tbl table { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 5px 6px; text-align: right; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

.btbl th { font-size: 11.5px; font-weight: 600; letter-spacing: 0; color: var(--muted); text-align: right; padding: 6px 0 4px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.btbl td { font-family: var(--font-body); font-variant-numeric: tabular-nums; text-align: right; padding: 5px 0 5px 10px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); white-space: nowrap; }
.btbl .nm { text-align: left; padding-left: 0; width: 100%; font-family: inherit; white-space: normal; }
.btbl th.nm { color: var(--fg); }
.btbl td.nm { font-family: var(--font-body, inherit); }

@media (max-width: 420px) { .btbl { font-size: 12px; } .btbl th, .btbl td { padding-left: 7px; } .btbl .pj { padding-left: 9px; } }
.final { position: absolute; inset: 0; z-index: 2; background: var(--surface); display: grid; align-content: center; gap: 16px; padding: 18px max(16px, 4%); overflow-y: auto; }
.final[hidden], .after[hidden] { display: none !important; }
.after { display: grid; gap: 16px; }
.final .ft { justify-self: center; font-size: 11px; font-weight: 700; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); border-radius: 999px; padding: 2px 10px; }
.fmatch { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.fmatch .tile { padding: 14px 16px; } .fmatch .tile .ts { font-size: clamp(36px, 6vw, 54px); }
.fmatch .tile.win { box-shadow: 0 0 0 2px var(--accent); }
.fmatch .tile.lose { opacity: .6; }
.fmatch .wtag { font-size: 10.5px; font-weight: 700; color: var(--bg); background: var(--accent); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 3px; }
.final .lines { justify-self: center; }

.stand { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stand .sc { border-radius: 12px; background: var(--raised); padding: 10px 12px; border-top: 3px solid var(--tc); display: grid; gap: 2px; min-width: 0; }

.sidenav { position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface); padding: 18px 14px; display: grid; gap: 16px; align-content: start; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }

<body>

      <div class="tile" id="tA"></div>
      <div class="clock"><div class="per" id="per">1st</div><div class="time" id="time">12:00</div><div class="simtag">Lab sim</div></div>
      <div class="tile r" id="tB"></div>

    <div class="controls">

        <div class="seg" role="group" aria-label="Speed">
          <button data-s="0.5" aria-pressed="false">½×</button><button data-s="1" aria-pressed="true">1×</button><button data-s="2" aria-pressed="false">2×</button>
        </div>

      </div>
      <div class="prog"><div class="flowl" id="flowl"></div><div class="bar" id="bar"><div class="fill" id="fill"></div></div><div class="marks" id="marks"></div></div>
      <div class="disclaim"><b>Lab sim</b><span>One representative run out of 5,000 simulations. Not a real game; ball paths are drawn for the animation.</span></div>
    </div>

    <div class="final" id="final" hidden></div>
  </section>
  <div id="vparlay"></div>
  <div id="vanswers"></div>

  <div id="after" class="after" hidden>
  <section class="card"><h2>Box score <small id="boxnote">this run, next to our projection</small></h2><div class="boxcols" id="box"></div></section>

  <div class="panels">
    <section class="card"><h2>All 5,000 runs <small>where this run sits</small></h2><div id="dist"></div></section>

<script src="sim-engine.js"></script>
<script>
// if anything breaks, say so in the frame instead of leaving it empty
addEventListener('error',e=>{const h=document.getElementById('hubbody');if(h&&!h.children.length)h.innerHTML='<div class="empty">The simulations could not load ('+String(e.message||'error').replace(/[<>&]/g,'')+'). Refresh the page to try again.</div>'});
let DATA = null;

/* ---------- shared helpers ---------- */
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ORD=['1ST','2ND','3RD','4TH','OT','2OT','3OT'], ORDL=['1st','2nd','3rd','4th','OT','2OT','3OT'];


/* ================= runs + typical pick ================= */
function runAll(G,sim){
  const n=G.runs, sc=new Array(n);
  for(let i=0;i<n;i++){const s=sim(100000+i,false).score;sc[i]=s}
  const mA=median(sc.map(s=>s[0])), mB=median(sc.map(s=>s[1]));
  const homeWins=sc.filter(s=>s[1]>s[0]).length, awayWins=sc.filter(s=>s[0]>s[1]).length;
  const fav=homeWins>=awayWins?1:0;
  // Replay pick, in two steps: the 150 runs closest to the median score (with the likelier winner), then among those
  // the one whose main player lines sit closest to our projections, so neither the score nor the stars look unusual.
  // With a live pick on the game, the replay must also land on the pick's side for every picked player: runs that don't
  // are passed over (scanning further from the median if needed), so a shared sim never contradicts a pick.
  const near=[];
  for(let i=0;i<n;i++){const s=sc[i];if((s[1]>s[0]?1:0)!==fav||s[0]===s[1])continue;
    near.push([Math.abs(s[0]-mA)+Math.abs(s[1]-mB)+Math.abs((s[1]-s[0])-(mB-mA)),i])}
  near.sort((a,b)=>a[0]-b[0]);
  const cand=[];let agree=0;
  for(let j=0;j<near.length&&j<1500&&(j<150||agree<150);j++){const [d,i]=near[j];
    const box=boxOf(G,sim(100000+i,true)), off=pickMisses(G,box);if(!off)agree++;
    if(j>=150&&off)continue;
    cand.push({d,i,box,off})}
  // NFL: the touchdowns go to the likeliest scorers too. Each player's chance to score is how often he scores across these
  // runs, and a run costs how unlikely its scorers and non-scorers are together, so the replay's TDs read like the game's
  // most typical ones instead of a fourth receiver catching two.
  const tdP=G.sport==='nfl'?tdRates(G,cand.map(c=>c.box)):null;
  let best=near[0][1],bd=1e9;
  for(const c of cand){const t=c.d/3+statMiss(G,c.box)+50*c.off+(tdP?2*tdMiss(G,c.box,tdP):0);if(t<bd){bd=t;best=c.i}}
  G.dist={sc,mA,mB,homeWins,awayWins,n,meanA:sc.reduce((a,s)=>a+s[0],0)/n,meanB:sc.reduce((a,s)=>a+s[1],0)/n};
  G.game=sim(100000+best,true);
}
const tds=b=>(b&&((b.rtd||0)+(b.rutd||0)))||0;
function tdRates(G,boxes){
  return G.teams.map((T,ti)=>{const r={};for(const b of boxes)for(const [id,x] of Object.entries(b[ti]))if(tds(x))r[id]=(r[id]||0)+1;
    for(const id in r)r[id]=r[id]/boxes.length;return r});
}
// -log chance of the run's scorers scoring (each of a player's TDs counts) and every other likely scorer (1 in 20 or better) not scoring
function tdMiss(G,box,p){
  let m=0;p.forEach((r,ti)=>{for(const [id,q] of Object.entries(r)){const n=tds(box[ti][id]);
    if(n)m-=n*Math.log(Math.max(q,0.02));else if(q>=0.05)m-=Math.log(1-Math.min(q,0.98))}});
  return m;
}
// The Lab's live picks on this game (data/sims/games.json picks): which player, the box stats the market adds up, and
// his projection for it.
const PICK_STAT={nba:{points:['pts'],rebounds:['reb'],assists:['ast'],threes:['tpm'],pra:['pts','reb','ast']},
  nfl:{td:['rtd','rutd'],rec_yards:['ryd'],receptions:['rec'],rush_yards:['ruyd'],carries:['car'],pass_yards:['pyd'],pass_tds:['ptd'],
    interceptions:['int'],completions:['cmp'],attempts:['att']}};
const NFL_PROJ={ryd:'rec_yards',rec:'receptions',ruyd:'rush_yards',car:'carries',pyd:'pass_yards',ptd:'pass_tds',int:'interceptions',cmp:'completions',att:'attempts'};
function gamePicks(gm,G){
  const game=gm.sport==='nfl'?gm.src.id:`${gm.src.away} at ${gm.src.home}`, out=[];
  for(const p of DATA.picks||[]){
    const keys=p.sport===gm.sport&&p.game===game&&PICK_STAT[gm.sport][p.market];if(!keys)continue;
    G.teams.forEach((T,ti)=>{
      const i=T.ps.findIndex(x=>gm.sport==='nfl'&&p.player_id?x.id===p.player_id:x.name===p.who);if(i<0)return;
      // his own projection, the number the pick was made from (not scaled to the book's team total)
      const pl=T.ps[i], proj=gm.sport==='nba'?keys.reduce((s,x)=>s+(pl[x]||0),0):p.market==='td'?null:keys.reduce((s,x)=>s+(pl[NFL_PROJ[x]]||0),0);
      out.push({ti,pid:gm.sport==='nfl'?pl.id:i,keys,side:p.side,line:p.line,proj});
    });
  }
  return out;
}
// How many of the game's picks a run's box score goes against.
function pickMisses(G,box){
  return (G.picks||[]).filter(k=>{const b=box[k.ti][k.pid]||{}, v=k.keys.reduce((s,x)=>s+(b[x]||0),0);
    return k.side==='yes'?v<1:k.side==='no'?v>=1:k.line==null?false:k.side==='over'?!(v>k.line):!(v<k.line)}).length;
}
// How far a recorded run's key player lines are from the projections, each miss measured in rough standard deviations.
function statMiss(G,box){
  let m=0;const miss=(v,proj,sd)=>{m+=Math.abs((v||0)-proj)/sd};
  // a picked player also lands close to his projection, not just on the right side of the line
  for(const k of G.picks||[])if(k.proj!=null){const b=box[k.ti][k.pid]||{};miss(k.keys.reduce((s,x)=>s+(b[x]||0),0),k.proj,Math.max(1,0.15*k.proj))}
  G.teams.forEach((T,ti)=>{const tb=box[ti];
    if(G.sport==='nba'){
      // every player's line, so no bench player has a night far off his projection
      T.ps.forEach((p,i)=>{const b=tb[i]||{};miss(b.pts,p.pts,6);miss(b.reb,p.reb,3);miss(b.ast,p.ast,2.5);miss(b.tpm,p.tpm,1.5)});
    }else{const g=id=>tb[id]||{},q=T.qb,b=g(q.id);
      miss(b.pyd,q.pass_yards,60);miss(b.ptd,q.pass_tds||0,0.9);miss(b.int,q.interceptions||0,0.8);
      [...T.rush].filter(p=>p!==q).sort((x,y)=>y.carries-x.carries).slice(0,1).forEach(p=>{miss(g(p.id).car,p.carries,4);miss(g(p.id).ruyd,p.rush_yards,30)});
      [...T.tgt].sort((x,y)=>y.rec_yards-x.rec_yards).slice(0,3).forEach(p=>miss(g(p.id).ryd,p.rec_yards,30));
    }});
  return m;
}

/* ================= rendering ================= */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let G=null, idx=-1, phase=1, playing=false, speed=1, last=0, layout=null;
const posCache={};

function sizeCanvas(){
  const w=cv.parentElement.clientWidth-parseFloat(getComputedStyle(cv.parentElement).paddingLeft)*2, ar=G.sport==='nba'?1.95:2.2;
  const h=Math.round(w/ar), dpr=(devicePixelRatio||1)*(window.CLIPZOOM||1);
  cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+'px'; ctx.setTransform(dpr,0,0,dpr,0,0);
  layout={w,h};
}
function colors(){return{court:css('--court'),line:css('--court-line'),paint:css('--paint'),field:css('--field'),fline:css('--field-line'),fnum:css('--field-num'),fg:css('--fg'),muted:css('--muted'),accent:css('--accent'),warn:css('--warn'),info:css('--info'),danger:css('--danger'),bg:css('--bg'),surface:css('--surface')}}
const ease=x=>x<0?0:x>1?1:x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const lerp=(a,b,t)=>a+(b-a)*t;

/* ----- NBA drawing ----- */
function nbaRight(off,t){return (off===0)!==(t>=1440&&t<2880)} // away attacks right in the first half
function abs94(u,v,right){return right?[94-u,v]:[u,v]}
function drawCourt(C){
  // flat, top-down court scaled to fit the frame
  const {w,h}=layout, s=Math.min((w-16)/94,(h-16)/50), ox=(w-94*s)/2, oy=(h-50*s)/2;
  const P=(x,y)=>[ox+x*s, oy+y*s];
  const kAt=()=>1;
  layout.P=P;layout.s=s;
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,w,h);
  const poly=(pts,fill,close)=>{ctx.beginPath();pts.forEach((p,i)=>{const q=P(p[0],p[1]);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});if(close)ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}ctx.stroke()};
  const arcPts=(cx,cy,r,a0,a1,n=40)=>[...Array(n+1)].map((_,i)=>{const a=a0+(a1-a0)*i/n;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]});
  ctx.strokeStyle=C.line;ctx.lineWidth=Math.max(1,s*0.16);ctx.lineJoin='round';
  // apron + floor
  const ap=[[-3,-2],[97,-2],[97,52],[-3,52]];ctx.save();ctx.strokeStyle='transparent';poly(ap,C.bg,true);ctx.restore();
  poly([[0,0],[94,0],[94,50],[0,50]],C.court,true);
  poly([[47,0],[47,50]]);
  poly(arcPts(47,25,6,0,Math.PI*2));
  ctx.save();ctx.strokeStyle=C.accent;ctx.globalAlpha=.55;poly(arcPts(47,25,2,0,Math.PI*2));ctx.restore();

  return `<section class="parlay" aria-label="Sim Parlay">
    <div class="ph"><div class="t"><b>Sim Parlay</b><span class="g">${p.game.replace(' at ',' @ ')} · ${fin}</span></div>
      <span class="pill${done?(p.hit?' hit':' miss'):''}">${done?(p.hit?'HIT':'MISS'):p.graded_at?'NO ACTION':Date.parse(p.start)<=Date.now()?'LIVE':'PENDING'}</span></div>
    <ul class="legs">${legs}</ul>
    <div class="joint"><p>${joint}</p><span class="big">${pct(p.chance)}</span></div>${hrows}
    <div class="pfoot"><span>Sim Parlay record <span class="rec">${parlayRecord(p.sport)}</span> · graded after every game</span></div>
  </section>`;
}
function renderGameParlay(gm){
  const el=document.getElementById('vparlay'), p=PARLAYS&&(PARLAYS.games||[]).find(x=>gameKey(x)===gm.key);
  el.innerHTML=p?parlayCard(p):'';
}
// Ask the sims (data/sims/answers.json, scripts/sim-parlays.ts): who scores first, who wins and the best pick in each
// game, counted from the same 5,000 runs, locked when the sim posts and graded on the real play-by-play.
let ANSWERS=null, askQ='first', askGame=null, askMsg='';
const ansOf=gm=>ANSWERS&&(ANSWERS.games||[]).find(a=>gameKey(a)===gm.key);
const who=n=>n==='Reserves'?'A bench player':n;
const MKT={points:'points',rebounds:'rebounds',assists:'assists',threes:'threes',pra:'pts + reb + ast',rec_yards:'receiving yards',receptions:'receptions',
  rush_yards:'rushing yards',carries:'carries',pass_yards:'passing yards',pass_tds:'passing TDs',interceptions:'interceptions',completions:'completions',attempts:'pass attempts'};
const pickText=p=>p.market==='td'?`${p.who} ${p.side==='no'?'no touchdown':'to score a touchdown'}`:`${p.who} ${p.side} ${p.line} ${MKT[p.market]||p.market}`;
const fairOf=x=>price(x>=0.5?-Math.round(100*x/(1-x)):Math.round(100*(1-x)/x));
const firstWord=sp=>sp==='nba'?'first basket':'first touchdown';
const QS={nba:[['first','Who scores first?'],['win','Who wins?'],['best','Best pick in each game']],
  nfl:[['first','Who scores the first TD?'],['anytime','Who scores a TD?'],['win','Who wins?'],['best','Best pick in each game']]};
function askKind(q){const t=q.toLowerCase();
  if(/any ?time|score an? (td|touchdown)|scores? a (td|touchdown)|td scorers?/.test(t)&&!/first|1st/.test(t))return 'anytime';
  if(/first|1st|opening|basket/.test(t))return 'first';
  if(/best|pick|bet|lock|parlay|prop/.test(t))return 'best';
  if(/win|winner|beat|final score|who.*(take|wins)/.test(t))return 'win';
  return null}
// a game named in the question: a team's nickname, city or abbreviation
function askFind(q,sp){const t=' '+q.toLowerCase().replace(/[^a-z0-9 ]/g,' ')+' ';
  return GAMES[sp].find(gm=>gm.teams.some(T=>{const full=team(sp,T.abbr)[0].toLowerCase(), words=full.split(' ');
    return t.includes(' '+T.abbr.toLowerCase()+' ')||t.includes(' '+words[words.length-1]+' ')||t.includes(' '+full+' ')||(words.length>2&&t.includes(' '+words.slice(0,-1).join(' ')+' '))}))||null}
function bars(list,actual){const top=Math.max(...list.map(x=>x.chance),0.01);
  return list.map(x=>{const real=actual&&x.team===actual.team&&x.name===actual.name;
    return `<div class="brow${real?' real':''}"><span class="n">${real?'✓ ':''}${who(x.name)} <span>${x.team}</span></span><span class="t"><i style="width:${100*x.chance/top}%"></i></span><span class="p">${pct(x.chance)}</span></div>`}).join('')}
function firstRecordLine(sp){const r=ANSWERS&&ANSWERS.record&&ANSWERS.record[sp];if(!r||!r.games)return '';
  return `Our pick to score first scored first in ${r.top_hits} of ${r.games} games (the sims expected about ${Math.round(r.expected)}). The real first scorer was on our list in ${r.listed} of ${r.games}.`}
// one game's answers: first scorer, TD scorers (NFL), the best pick and who wins
function ansBlock(a,gm){
  const [A,H]=[a.away,a.home], fav=a.win[H]>=a.win[A]?H:A, done=a.graded_at&&a.actual;
  const real=done?`<p class="afoot"><b style="color:var(--fg)">Scored first: ${who(a.actual.name)} (${a.actual.team})</b>, who scored first in ${a.actual.chance?pct(a.actual.chance):'fewer than the listed share'} of our runs.</p>`:'';
  const top=a.first[0];
  return `<section class="ans" aria-label="Ask the sims">
    <h2>Ask the sims <small class="label" style="margin-left:6px">${A} @ ${H} · ${a.runs.toLocaleString('en-US')} runs</small></h2>
    <div class="cols">
      <div class="blk"><div class="label">Who scores the ${firstWord(a.sport)}?</div>
        <p class="alead">${top?`<b>${who(top.name)}</b> scores first in ${pct(top.chance)} of runs (fair ${fairOf(top.chance)}). Nobody is a lock: even the likeliest scorer does it less than 1 time in ${Math.max(2,Math.floor(1/top.chance))}.`:'No touchdowns in these runs.'}</p>
        ${bars(a.first,done?a.actual:null)}${a.sport==='nfl'&&a.none?`<p class="afoot">No touchdown at all in ${pct(a.none)} of runs.</p>`:''}${real}</div>
      ${a.anytime?`<div class="blk"><div class="label">Who scores a touchdown?</div><p class="alead">Share of runs in which each player scores at least once.</p>${bars(a.anytime)}</div>`:''}
      <div class="blk"><div class="label">Best pick</div>
        ${a.picks.length?a.picks.map(p=>`<div class="pk"><span class="l">The Lab's pick</span><b>${pickText(p)}</b></div>`).join(''):'<div class="pk"><span class="l">The Lab\'s pick</span><span>No pick on this game. Our picks only go out when a line clears the bar our backtests set.</span></div>'}
        ${a.sure.map(l=>`<div class="pk"><span class="l">Surest sim line</span><b>${l.name} ${l.min}+ ${LEGW[l.stat]} <span class="c">· ${pct(l.chance)} of runs</span></b></div>`).join('')}
        <div class="label" style="margin-top:6px">Who wins?</div>
        <p class="alead"><b>${fav}</b> wins ${pct(a.win[fav])} of runs (fair ${fairOf(a.win[fav])}). Average score ${A} ${a.avg[A].toFixed(1)}, ${H} ${a.avg[H].toFixed(1)}.</p></div>
    </div>
    <p class="afoot">Counted from this game's ${a.runs.toLocaleString('en-US')} simulations, posted with the sim and locked. ${a.sport==='nba'?'The first basket is the first made field goal; free throws don\'t count. The sims treat the opening tip as a coin flip.':'The sims have no defensive or return touchdowns.'} ${firstRecordLine(a.sport)}</p>
  </section>`}
function askRows(sp){
  const L=GAMES[sp].map(gm=>({gm,a:ansOf(gm)})).filter(x=>x.a);
  if(!L.length)return '<p class="alead">The answers post with each game\'s sim on game day.</p>';
  const row=(gm,mid,v)=>`<a class="arow" href="#${gm.key}"><span class="g">${gm.teams[0].abbr} @ ${gm.teams[1].abbr}</span><span class="w">${mid}</span><span class="v">${v}</span></a>`;
  if(askQ==='first'||askQ==='anytime'){const any=askQ==='anytime';
    return `<p class="alead">${any?'The likeliest touchdown scorer in each game: the share of runs where he scores at least once.':`The likeliest ${firstWord(sp)} scorer in each game. Nobody is a lock: the top name usually does it in fewer than 1 run in 5.`}</p><div class="arows">${L.map(({gm,a})=>{const l=any?a.anytime:a.first, x=l&&l[0];
      return x?row(gm,`<b>${who(x.name)}</b> <small>${x.team}${l[1]?` · next: ${who(l[1].name)} ${pct(l[1].chance)}`:''}</small>`,`${pct(x.chance)}<small>fair ${fairOf(x.chance)}</small>`):''}).join('')}</div>`}
  if(askQ==='win')return `<p class="alead">Share of the 5,000 runs each favorite wins.</p><div class="arows">${L.map(({gm,a})=>{const f=a.win[a.home]>=a.win[a.away]?a.home:a.away;
      return row(gm,`<b>${team(sp,f)[0]}</b> <small>avg ${a.away} ${a.avg[a.away].toFixed(1)} · ${a.home} ${a.avg[a.home].toFixed(1)}</small>`,`${pct(a.win[f])}<small>fair ${fairOf(a.win[f])}</small>`)}).join('')}</div>`;
  return `<p class="alead">The Lab's pick on each game, and the line the sims hit most often from the books' ladders.</p><div class="arows">${L.map(({gm,a})=>{const s=a.sure[0];
      return row(gm,`<b>${a.picks.length?a.picks.map(pickText).join(' · '):'No Lab pick on this game'}</b>${s?`<small>Surest sim line: ${s.name} ${s.min}+ ${LEGW[s.stat]}</small>`:''}`,s?`${pct(s.chance)}<small>of runs</small>`:'')}).join('')}</div>`;
}
function askAnswer(sp){
  if(askGame){const a=ansOf(askGame);if(a)return `${askMsg}${ansBlock(a,askGame)}`}
  return askMsg+askRows(sp);
}
function askHtml(sp){
  if(!ANSWERS||!GAMES[sp].some(gm=>ansOf(gm)))return '';
  if(askGame&&askGame.sport!==sp){askGame=null;askMsg=''}
  if(askQ==='anytime'&&sp!=='nfl')askQ='first';
  return `<section class="ask" id="ask" aria-label="Ask the sims"><h2>Ask the sims</h2><p class="sub">Questions answered straight from every game's 5,000 simulated runs.</p>
    <form id="askf"><input id="askin" placeholder="${sp==='nba'?'Who scores first in Lakers Warriors?':'Who scores the first TD in Packers Panthers?'}" aria-label="Ask the sims a question" autocomplete="off"><button class="btn primary">Ask</button></form>
    <div class="qchips" id="askchips">${QS[sp].map(([k,l])=>`<button type="button" data-q="${k}" aria-pressed="${!askGame&&k===askQ}">${l}</button>`).join('')}</div>
    <div id="askans">${askAnswer(sp)}</div></section>`}
function bindAsk(sp){
  const f=document.getElementById('askf');if(!f)return;
  const redraw=()=>{document.querySelectorAll('#askchips button').forEach(b=>b.setAttribute('aria-pressed',String(!askGame&&b.dataset.q===askQ)));document.getElementById('askans').innerHTML=askAnswer(sp)};
  document.getElementById('askchips').onclick=e=>{const k=e.target.closest('button')?.dataset.q;if(!k)return;askQ=k;askGame=null;askMsg='';redraw()};
  f.onsubmit=e=>{e.preventDefault();const q=document.getElementById('askin').value.trim();if(!q)return;
    const k=askKind(q), gm=askFind(q,sp);askMsg='';
    if(k==='anytime'&&sp!=='nfl'){askQ='first'}else if(k)askQ=k;
    askGame=gm&&ansOf(gm)?gm:null;
    if(!k&&!askGame)askMsg=`<p class="alead">I can answer who scores first${sp==='nfl'?', who scores a touchdown':''}, who wins, and the best pick, for every game or for one (name a team). Here is who scores first:</p>`;
    if(!k&&!askGame)askQ='first';
    redraw()};
}
function renderGameAnswers(gm){
  const el=document.getElementById('vanswers'), a=ansOf(gm);
  el.innerHTML=a?ansBlock(a,gm):'';
}
// warm every game in the background so cards show real win chances and open instantly
let warmQ=[];
function warm(){const gm=warmQ.shift();if(!gm)return;if(!gm.G){build(gm);if(!document.getElementById('hub').hidden)renderHub()}setTimeout(warm,30)}
// The page lives in a frame on the site: tell the site which game is open (so the address bar holds a shareable
// link) and how tall the content is (so the frame has no scrollbar of its own).
const host=(()=>{try{return parent!==window&&parent.location.href?parent:null}catch(_){return null}})();
const tell=m=>{if(host)host.postMessage({lab:'sims',...m},location.origin)};
const sitePath=key=>{const gm=key&&[...GAMES.nba,...GAMES.nfl].find(g=>g.key===key);const sp=gm?gm.sport:key;return (sp==='nba'?'/nba/sims':'/sims')+(gm?'/'+gm.key:'')};
const shareUrl=key=>{const L=host?host.location:location;return L.origin+L.pathname+'#'+sitePath(key)};
function route(){
  const h=location.hash.slice(1), gm=[...GAMES.nba,...GAMES.nfl].find(g=>g.key===h);
  const hub=document.getElementById('hub'), view=document.getElementById('viewer');
  if(gm){hub.hidden=true;view.hidden=false;hubSport=gm.sport;document.getElementById('back').href='#'+gm.sport;document.getElementById('vtitle').textContent=`${gm.teams[0].name} at ${gm.teams[1].name}`;openGame(gm);tell({route:sitePath(gm.key),top:true})}
  else{setPlaying(false);view.hidden=true;hub.hidden=false;if(h==='nba'||h==='nfl')hubSport=h;renderHub();tell({route:sitePath(hubSport)})}
}
function openGame(gm){
  setPlaying(false);
  G=build(gm); if(G.sport==='nba')NBA=G;else NFL=G;
  posCache.nba=null;posCache.ballPrev=null;posCache.nflBall=null;posCache.nflLines=null;posCache.cur=null; idx=-1; phase=1;
  document.getElementById('final').hidden=true; document.getElementById('after').hidden=true; G.drives=null; sizeCanvas(); winSeries(); renderMarks(); renderDrives(); renderDist(); renderHow(); renderIntro(); renderAll(); renderGameParlay(gm); renderGameAnswers(gm);
}

document.getElementById('play').onclick=()=>{document.getElementById('intro').hidden=true;document.getElementById('final').hidden=true;playing?setPlaying(false):start()};
document.getElementById('restart').onclick=()=>{document.getElementById('intro').hidden=true;document.getElementById('final').hidden=true;posCache.nba=null;posCache.ballPrev=null;posCache.nflBall=null;posCache.nflLines=null;stepTo(0);setPlaying(true)};
document.getElementById('skip').onclick=()=>{document.getElementById('intro').hidden=true;stepTo(G.game.ev.length-1);phase=1;setPlaying(false);renderAll();renderFinal()};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
document.getElementById('bar').onclick=ev=>{const seg=ev.target.closest('.dseg');if(seg){document.getElementById('intro').hidden=true;document.getElementById('final').hidden=true;stepTo(+seg.dataset.first);phase=1;renderAll();return}const r=ev.currentTarget.getBoundingClientRect();const f=(ev.clientX-r.left)/r.width;document.getElementById('intro').hidden=true;document.getElementById('final').hidden=true;posCache.nba=null;posCache.ballPrev=null;posCache.nflBall=null;posCache.nflLines=null;stepTo(Math.floor(f*G.game.ev.length));phase=1;renderAll()};
addEventListener('resize',()=>{if(G&&!document.getElementById('viewer').hidden)sizeCanvas()});
addEventListener('hashchange',route);
G=null;
new ResizeObserver(()=>tell({height:document.body.offsetHeight})).observe(document.body);
fetch('data/sims/games.json',{cache:'no-cache'}).then(r=>r.ok?r.json():Promise.reject(r.status)).catch(()=>({nfl:{games:[]},nba:{games:[],players:{}}})).then(d=>{
  DATA=d; makeGames();
  const h=location.hash.slice(1); if(h==='nba'||h.startsWith('nba-'))hubSport='nba';
  warmQ=[featured(hubSport),...GAMES[hubSport]].filter(Boolean);
  route(); setTimeout(warm,60);
});
fetch('data/sims/parlays.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null).then(p=>{PARLAYS=p;if(!p||!DATA)return;
  const gm=[...GAMES.nba,...GAMES.nfl].find(g=>g.key===location.hash.slice(1));if(gm)renderGameParlay(gm)});
fetch('data/sims/answers.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null).then(a=>{ANSWERS=a;if(!a||!DATA)return;
  const gm=[...GAMES.nba,...GAMES.nfl].find(g=>g.key===location.hash.slice(1));if(gm)renderGameAnswers(gm);else if(!document.getElementById('hub').hidden)renderHub()});
fetch('data/sims/grades.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null).then(g=>{GRADES=g;if(g&&DATA&&!document.getElementById('hub').hidden)renderHub()});
requestAnimationFrame(frame);
</script>
